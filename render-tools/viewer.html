<!doctype html>
<html><head><meta charset="utf-8"><title>GLB viewer</title></head>
<body style="margin:0;background:#222;overflow:hidden">
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
// Bare-bones GLB previewer used by _viewasset.mjs (DIR must also contain
// three.min.js + GLTFLoader.js -- see render-tools/README.md). Loads
// ?f=<file>.glb relative to this page, orbits a simple camera around it,
// and sets window.__done so the Playwright script knows when to screenshot.
window.__done = false;
const W = 900, H = 600;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.05, 1000);
camera.position.set(3, 2.4, 4.2);
camera.lookAt(0, 0.6, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
const dl = new THREE.DirectionalLight(0xffffff, 1.6);
dl.position.set(5, 8, 5);
scene.add(dl);
const grid = new THREE.GridHelper(6, 12, 0x666666, 0x333333);
scene.add(grid);

const params = new URLSearchParams(location.search);
const file = params.get('f') || 'plant.glb';
new THREE.GLTFLoader().load(
  file,
  (gltf) => {
    scene.add(gltf.scene);
    renderer.render(scene, camera);
    window.__done = true;
  },
  undefined,
  (err) => {
    console.error('GLTF load error', err);
    window.__done = true;
  }
);
(function tick() {
  requestAnimationFrame(tick);
  renderer.render(scene, camera);
})();
</script>
</body></html>
